[project]
name = "turni-backend"
version = "0.1.0"
description = "Turni shift scheduler — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "argon2-cffi>=23.1",
    "ortools>=9.11",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migration bodies are alembic-generated DDL: one long call per column, and
# reflowing them by hand would make the next autogenerated diff unreadable.
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Phase-of-origin markers (project conventions): every test module carries
# exactly one, so a gate run is selectively reproducible later — e.g.
# `pytest -m phase3`. Strict, so a typo'd marker fails collection instead of
# silently selecting nothing.
addopts = "--strict-markers"
markers = [
    "phase0: originated in Phase 0 (scaffold)",
    "phase1: originated in Phase 1 (data + auth)",
    "phase2: originated in Phase 2 (solver core)",
    "phase3: originated in Phase 3 (constraints lifecycle)",
    "phase4: originated in Phase 4 (schedule UI + swaps)",
    "phase5: originated in Phase 5 (notifications + i18n)",
    "phase6: originated in Phase 6 (admin/root + deploy)",
]
