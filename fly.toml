# Fly.io deployment — ONE option, not the required host. Spec §11 (v1.9) states
# the host requirements (Dockerfile, persistent volume, exactly one instance,
# secrets, /healthz, a pinnable proxy peer) rather than naming a vendor; see
# docs/deploy.md, which also covers Northflank. This file exists because the
# shape is fiddly enough to be worth committing for whoever picks Fly.
#
# `app` is set by `fly launch`; keep the name stable once created.
app = "turni"
primary_region = "fra"   # Frankfurt: closest Fly region to Italy.

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Europe/Rome"
  DATABASE_URL = "sqlite:////data/turni.db"
  BACKUP_DIR = "/data/backups"
  STATIC_DIR = "/app/static"
  # Closes the Phase 1 carry-forward. Fly terminates TLS at its edge and reaches
  # the app over the private network, so the immediate peer is the Fly proxy.
  # MUST be pinned to that peer and never "*": a wildcard lets any client forge
  # X-Forwarded-For and defeat the per-IP login limit. Verify the actual peer
  # after first deploy (`fly logs`) and correct this if it differs.
  FORWARDED_ALLOW_IPS = "172.16.0.0/12"

[[mounts]]
  source = "turni_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # SQLite + an in-process APScheduler means exactly ONE writer. Two machines
  # would double every cron (two Sunday solves, two nightly backups) and corrupt
  # the single-writer assumption, so autostop/autostart and scaling stay off.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  # §11 health endpoint.
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  # CP-SAT is the only heavy thing here and a solve is ~0.3 s single-threaded
  # (the solver is pinned to one worker for determinism, §8).
  size = "shared-cpu-1x"
  memory = "512mb"
